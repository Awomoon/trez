name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # The site currently lives on this branch; keeping it here means Pages
      # stays up to date before the work is merged into main.
      - claude/birthday-website-nextjs-wrhv1u
  workflow_dispatch:

# Allow the workflow to publish to Pages via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, and let a newer push supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Creates the Pages site on the first run so nobody has to click
          # through the repository settings.
          enablement: true

      - name: Build
        # Pages serves a project repo from /<repo>, so the export needs that
        # prefix baked in. `base_path` comes from the step above, which means
        # this keeps working if the repo is renamed or moved to a custom domain.
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Disable Jekyll
        # Without this, Pages ignores every directory beginning with an
        # underscore — which is all of Next's output.
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
